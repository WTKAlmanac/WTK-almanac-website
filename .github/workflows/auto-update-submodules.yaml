name: Auto Update Submodules

on:
  repository_dispatch:
    types:
      - submodule-updated
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-submodules-${{ github.event.client_payload.target_branch || github.event.repository.default_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target branch
        id: target
        shell: bash
        env:
          PAYLOAD_BRANCH: ${{ github.event.client_payload.target_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="${PAYLOAD_BRANCH:-${DEFAULT_BRANCH:-${REF_NAME}}}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.SUBMODULE_PUSH_TOKEN != '' && secrets.SUBMODULE_PUSH_TOKEN || github.token }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update tracked submodules
        id: update
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync --recursive
          git submodule update --init --remote --recursive

          if git diff --quiet --submodule=short; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            git diff --submodule=short
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit updated submodule pointers
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          git commit -m "chore: update submodules"

      - name: Push changes
        if: steps.update.outputs.changed == 'true'
        run: git push origin HEAD:${{ steps.target.outputs.branch }}

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Auto Update Submodules"
            echo
            echo "- Target branch: \`${{ steps.target.outputs.branch }}\`"
            if [[ "${{ steps.update.outputs.changed }}" == "true" ]]; then
              echo "- Result: submodule changes committed and pushed"
              echo
              echo '```diff'
              printf '%s\n' "${{ steps.update.outputs.summary }}"
              echo '```'
            else
              echo "- Result: no submodule changes detected"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
